extends: single_turn_magrpo_config.yaml
algorithm: maac
travel:
  curriculum_short_epochs: 0
critic_model:
  name: Qwen/Qwen3-4B-Instruct-2507
  torch_dtype: bfloat16
  attn_implementation: sdpa
maac:
  num_agents: 2
  num_turns: 1
  parallel_training: mp
  agent_devices: ["cuda:0", "cuda:1"]
  critic_devices: ["cuda:2"]
  critic_type: v
  num_train_epochs: 84
  num_generations: 1
  logging_steps: 20
  agent_learning_rate: 5.0e-6
  critic_learning_rate: 5.0e-6
  max_new_tokens: 1024
  rollout_buffer_size: 10
  train_batch_size: 10
  advantage_normalization: false
  value_loss_coef: 0.6
  discount: 1.0
  early_termination_threshold: null
  eval_interval: 60
  eval_num_samples: 4
  eval_batch_size: 1
  reference_kl_enabled: false
evaluation:
  final_num_samples: 20
output:
  base_dir: output_single_turn_maac
wandb:
  name: Travel-maac-qwen3-4b
  tags: [travelplanner, maac, two-actors, value-only, shared-critic]
