agent_model:
  name: Qwen/Qwen3-4B-Instruct-2507
  type: qwen
  temperature: 0.7
  top_p: 0.8
  top_k: null
  special_tokens: {}
  torch_dtype: bfloat16
  # TravelPlanner prompts are much longer than BFCL prompts. Eager attention
  # materializes an O(sequence_length^2) attention matrix and OOMs even on B200.
  attn_implementation: sdpa
  gradient_checkpointing: true

agents: null

dataset:
  name: osunlp/TravelPlanner
  config_name: train
  source_split: train
  train_samples: 40
  eval_samples: 5

seed: 42

output:
  base_dir: output_single_turn_magrpo
  verbose: true
  save_final_model: true

travel:
  role_mode: partitioned_roles
  # Render instructions with the model-native system/user/assistant template.
  use_chat_template: true
  system_prompt: >-
    You are one agent in a decentralized travel-planning team. Follow the user's
    role and output contract exactly. Return only the requested JSON object.
  # Strict decoding uses "{" as assistant prefill (not a sampled policy token),
  # then stops each sequence independently at its matching top-level "}".
  force_json_prefix: true
  stop_after_complete_json: true

travel_reward:
  parse_weight: 0.05
  # Prefer choosing the right itinerary entries over merely filling every slot.
  coverage_weight: 0.20
  slot_quality_weight: 0.45
  grounding_weight: 0.0
  empty_match_weight: 0.05
  balance_weight: 0.15
  role_weight: 0.10
  exact_bonus: 0.20
  cooperation_floor: 0.20
  # Equal-weight geometric blend of continuous protocol validity and semantic
  # contribution. Strict team validity remains an exact-match bonus condition.
  validity_gate_weight: 0.50
  overlap_penalty: 0.15
  conflict_penalty: 0.30
  lazy_agent_penalty: 0.25
  invalid_slot_penalty: 0.15
  extra_assignment_penalty: 0.25
  self_duplicate_penalty: 0.15
  empty_mismatch_penalty: 0.25
  spurious_fill_penalty: 0.15
  min_reward: -0.5
  max_reward: 1.2

magrpo:
  parallel_training: mp
  agent_devices:
  - cuda:0
  - cuda:1
  num_agents: 2
  num_turns: 1
  # 40 prompts x 32 epochs x 4 aligned generations = 5120 env steps,
  # matching the current BFCL native-parallel MAGRPO configuration.
  num_train_epochs: 32
  agent_learning_rate: 2.0e-05
  logging_steps: 20
  num_generations: 4
  max_new_tokens: 1024
  discount: 1.0
  joint_mode: aligned
  early_termination_threshold: null
  rollout_buffer_size: 4
  train_batch_size: 4
  advantage_normalization: true
  advantage_mode: mean
  # The trainer interprets this as a within-epoch batch interval. With 40 rows,
  # 40 means one evaluation at the start of each epoch instead of five.
  eval_interval: 40
  eval_num_samples: 5
  eval_batch_size: 1
  eval_at_end: true
  reference_kl_enabled: false
  reference_kl_coef: 0.1
  reference_devices: null

reward_processor:
  enabled: true
  scale_factor: 1.0
  shift: null

wandb:
  enabled: true
  project: Travel
  entity: OpenMLRL
  name: Travel-magrpo-qwen3-4b-partitioned-v3
  dir: output_single_turn_magrpo
  tags:
  - magrpo
  - travelplanner
  - single-turn
  - qwen3-4b-instruct-2507
  - decentralized
  - role-guided
  - reward-v3
  - structured-json
