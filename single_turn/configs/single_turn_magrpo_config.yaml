agent_model:
  name: Qwen/Qwen3-4B-Instruct-2507
  type: qwen
  temperature: 0.7
  top_p: 0.8
  top_k: null
  special_tokens: {}
  torch_dtype: bfloat16
  # TravelPlanner prompts are much longer than BFCL prompts. Eager attention
  # materializes an O(sequence_length^2) attention matrix and OOMs even on B200.
  attn_implementation: sdpa
  gradient_checkpointing: true

agents: null

dataset:
  name: osunlp/TravelPlanner
  revision: 8736504ecfc31b7f8b7e40122873c337e83fff7c
  # This is a custom curriculum split, not the official validation protocol.
  # Keep only the four simplest scalable cells: 3/5 days x easy/medium. This
  # excludes every hard, 7-day, and 3-city query while retaining enough data.
  config_name: validation
  source_split: validation
  filters:
    days: [3, 5]
    levels: [easy, medium]
    visiting_city_numbers: [1, 2]
    # These filters produce exactly 80 rows with reference contexts no longer
    # than 35,838 characters at the pinned revision.
    select_shortest: 80
    max_reference_chars: null
  partition:
    stratify_by: [days, level]
    # Order held-out rows as five balanced four-example panels so cyclic eval
    # sees one example from every stratum on every call.
    interleave_eval: true
  train_samples: 60
  eval_samples: 20

seed: 42

output:
  base_dir: output_single_turn_magrpo
  verbose: true
  save_final_model: true

travel:
  role_mode: partitioned_roles
  # Render instructions with the model-native system/user/assistant template.
  use_chat_template: true
  system_prompt: >-
    You are one agent in a decentralized travel-planning team. Follow the user's
    role and output contract exactly. Return only the requested JSON object.
    Close the assignments array with ] before the final top-level }.
  # Strict decoding prefills the first assignment and then forces every later
  # day/field/key/delimiter. The policy chooses only slot values and when to
  # close them; fixed schema tokens are excluded from the Travel policy loss.
  force_json_prefix: true
  constrain_json_skeleton: true
  max_value_tokens: 32
  # Average over freely selected value tokens instead of summing hundreds of
  # completion-token log probabilities into one oversized policy update.
  normalize_value_log_probs: true
  stop_after_complete_json: true
  # Periodic eval uses greedy argmax on the fixed P1 anchor; training remains
  # stochastic with the model sampling settings above.
  greedy_eval: true
  # Spend the first 960 env steps on all 30 three-day rows, then expose the
  # complete 60-row split for the remaining 4080 steps.
  curriculum_short_epochs: 8
  curriculum_days: [3]

travel_reward:
  # Reward v7 reserves 91% of its positive range for strict joint quality and
  # final success. The two 0.02/0.03 dense channels make early malformed
  # rollouts rankable but cannot substitute for a valid team action.
  protocol_progress_weight: 0.02
  recovered_semantic_weight: 0.03
  action_validity_weight: 0.04
  team_action_weight: 0.02
  strict_balance_weight: 0.14
  strict_quality_weight: 0.57
  strict_grounding_weight: 0.08
  final_success_bonus: 0.10
  # These five terms sum to the unit plan-quality score.
  assignment_coverage_weight: 0.20
  required_grounded_weight: 0.25
  grounding_f1_weight: 0.15
  commonsense_weight: 0.25
  hard_constraint_weight: 0.15
  grounding_support_floor: 0.10
  invalid_action_penalty: 0.10
  conflict_penalty: 0.05
  overlap_penalty: 0.05
  reference_copy_penalty: 0.10
  overlong_penalty: 0.05
  min_reward: -0.25
  max_reward: 1.0

magrpo:
  parallel_training: mp
  agent_devices:
  - cuda:0
  - cuda:1
  num_agents: 2
  num_turns: 1
  # 8 x 30 short prompts + 17 x 60 full prompts, all with 4 aligned
  # generations, gives 5040 env steps. This remains within 1.6% of BFCL's
  # 5120-step budget and keeps 126 optimizer updates at buffer size 10.
  num_train_epochs: 25
  agent_learning_rate: 2.0e-05
  logging_steps: 20
  num_generations: 4
  max_new_tokens: 1024
  discount: 1.0
  joint_mode: aligned
  early_termination_threshold: null
  # The prior buffer of four updated after only 16 env steps. With Travel's
  # long structured completions, per-prompt unit-variance normalization turned
  # near-zero reward noise into order-one advantages and collapsed both runs.
  # Ten prompts still fit sequentially on one B200 and divide each 60-row epoch.
  rollout_buffer_size: 10
  train_batch_size: 10
  advantage_normalization: false
  advantage_mode: mean
  # Re-evaluate the same balanced four-row anchor panel so adjacent W&B points
  # are comparable. The terminal evaluation still uses the full 20-row pool.
  eval_interval: 60
  eval_num_samples: 4
  rotate_eval_subset: false
  final_eval_num_samples: 20
  eval_batch_size: 1
  eval_at_end: true
  reference_kl_enabled: false
  reference_kl_coef: 0.1
  reference_devices: null

reward_processor:
  enabled: true
  scale_factor: 1.0
  shift: null

wandb:
  enabled: true
  project: Travel
  entity: OpenMLRL
  name: Travel-magrpo-qwen3-4b-fixed-skeleton-v8-60train
  dir: output_single_turn_magrpo
  tags:
  - magrpo
  - travelplanner
  - single-turn
  - qwen3-4b-instruct-2507
  - decentralized
  - role-guided
  - reward-v7-learnable
  - fixed-skeleton-v8
  - two-stage-3day-curriculum
  - greedy-fixed-anchor
  - compact-role-catalogs
  - no-advantage-normalization
  - validation-simple-60train-20eval
  - structured-json
  - fixed-anchor-eval
