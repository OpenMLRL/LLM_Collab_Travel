agent_model:
  name: Qwen/Qwen3-4B-Instruct-2507
  type: qwen
  temperature: 0.7
  top_p: 0.8
  top_k: null
  special_tokens: {}
  torch_dtype: bfloat16
  # TravelPlanner prompts are much longer than BFCL prompts. Eager attention
  # materializes an O(sequence_length^2) attention matrix and OOMs even on B200.
  attn_implementation: sdpa
  gradient_checkpointing: true

agents: null

dataset:
  name: osunlp/TravelPlanner
  config_name: train
  source_split: train
  train_samples: 40
  eval_samples: 5

seed: 42

output:
  base_dir: output_single_turn_magrpo
  verbose: false
  save_final_model: false

travel:
  role_mode: soft_roles

travel_reward:
  parse_weight: 0.05
  coverage_weight: 0.15
  slot_quality_weight: 0.35
  grounding_weight: 0.15
  balance_weight: 0.10
  role_weight: 0.10
  exact_bonus: 0.20
  overlap_penalty: 0.10
  conflict_penalty: 0.20
  lazy_agent_penalty: 0.15
  invalid_slot_penalty: 0.05
  extra_assignment_penalty: 0.05
  self_duplicate_penalty: 0.10
  empty_mismatch_penalty: 0.25
  min_reward: -0.4
  max_reward: 1.2

magrpo:
  parallel_training: mp
  agent_devices:
  - cuda:0
  - cuda:1
  num_agents: 2
  num_turns: 1
  # 40 prompts x 32 epochs x 4 aligned generations = 5120 env steps,
  # matching the current BFCL native-parallel MAGRPO configuration.
  num_train_epochs: 32
  agent_learning_rate: 2.0e-05
  logging_steps: 20
  num_generations: 4
  max_new_tokens: 1536
  discount: 1.0
  joint_mode: aligned
  early_termination_threshold: null
  rollout_buffer_size: 4
  train_batch_size: 4
  advantage_normalization: true
  advantage_mode: mean
  eval_interval: 8
  eval_num_samples: 5
  eval_batch_size: 1
  reference_kl_enabled: false
  reference_kl_coef: 0.1
  reference_devices: null

reward_processor:
  enabled: true
  scale_factor: 4.0
  shift: null

wandb:
  enabled: true
  project: travelplanner-collab
  entity: OpenMLRL
  name: single_turn_magrpo_qwen3_4b_role_guided
  dir: output_single_turn_magrpo
  tags:
  - magrpo
  - travelplanner
  - single-turn
  - qwen3-4b-instruct-2507
  - decentralized
  - role-guided
