extends: single_turn_mapl_config.yaml
algorithm: madpo_iter
mapl:
  # At most 7 * 60 * 6 * 2 = 5040 pair-counted env steps. Ties reduce this.
  num_iterations: 7
  num_train_epochs: 1
  pair_selection: comparator_reward
  comparator_policy: current_copy
  comparator_generation_mode: decentralized
  comparator_devices: [cuda:0, cuda:0]
  preference_replay_mode: lambda_decay
  preference_replay_lambda: 0.8
  log_reward_distribution: true
  # MADPO measures this interval in optimizer updates, unlike online MAGRPO.
  eval_interval: 12
output:
  base_dir: output_single_turn_madpo_iter
wandb:
  name: Travel-madpo-iter-qwen3-4b
